# A workspace of its own: these tests build for the HOST and run the RISC-V binaries
# inside ckb-testtool's mock VM.
[workspace]

[package]
name = "tests"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
ckb-testtool = "0.14"
blake2b-ref = "0.3"
# Only for the host-side check of `Since` comparisons in 09; the scripts use their own.
ckb-std = "=0.15.3"
